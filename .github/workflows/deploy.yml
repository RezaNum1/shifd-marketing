name: Deploy to Biznet GIO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shifd-marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BIZNET_SSH_KEY }}
          SSH_HOST: ${{ secrets.BIZNET_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.BIZNET_HOST }}
          SSH_USER: ${{ secrets.BIZNET_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -euo pipefail

            APP_DIR="/var/www/shifd-marketing"
            BACKEND_DIR="$APP_DIR/backend"
            FRONTEND_DIR="$APP_DIR/frontend"

            echo "========================================"
            echo "Starting Shifd Marketing deployment"
            echo "========================================"

            echo ""
            echo "=== Updating source ==="

            cd "$APP_DIR"

            git fetch origin main
            git reset --hard origin/main

            echo ""
            echo "=== Installing backend dependencies ==="

            cd "$BACKEND_DIR"

            npm ci

            echo ""
            echo "=== Generating Prisma client ==="

            npm run db:generate

            echo ""
            echo "=== Building backend ==="

            npm run build

            echo ""
            echo "=== Installing frontend dependencies ==="

            cd "$FRONTEND_DIR"

            npm ci

            echo ""
            echo "=== Building frontend ==="

            npm run build

            echo ""
            echo "=== Applying database migrations ==="

            cd "$BACKEND_DIR"

            npm run db:deploy

            echo ""
            echo "=== Restarting backend ==="

            pm2 restart shifd-marketing-api --update-env
            pm2 save

            echo ""
            echo "=== Waiting for backend ==="

            BACKEND_READY=false

            for i in {1..15}; do
              if curl -sS -o /dev/null http://127.0.0.1:3000/; then
                echo "Backend is ready."
                BACKEND_READY=true
                break
              fi

              echo "Backend not ready yet. Attempt $i/15..."
              sleep 2
            done

            if [ "$BACKEND_READY" != "true" ]; then
              echo ""
              echo "ERROR: Backend failed to start."

              echo ""
              echo "=== PM2 status ==="
              pm2 status

              echo ""
              echo "=== PM2 logs ==="
              pm2 logs shifd-marketing-api --lines 100 --nostream

              exit 1
            fi

            echo ""
            echo "=== Checking frontend ==="

            if ! curl -fsS \
              --resolve shifdmarketing.site:443:127.0.0.1 \
              https://shifdmarketing.site/ > /dev/null; then
              echo "ERROR: Frontend health check failed."
              exit 1
            fi

            echo ""
            echo "=== Deployment completed successfully ==="

            pm2 status

            echo ""
            echo "========================================"
            echo "Shifd Marketing deployment completed"
            echo "========================================"
          EOF