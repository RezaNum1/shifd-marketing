name: Deploy to Biznet GIO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shifd-marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BIZNET_SSH_KEY }}
          SSH_HOST: ${{ secrets.BIZNET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.BIZNET_HOST }}
          SSH_USER: ${{ secrets.BIZNET_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -euo pipefail

            echo "=== Updating source ==="
            cd /var/www/shifd-marketing
            git fetch origin main
            git reset --hard origin/main

            echo "=== Building backend ==="
            cd /var/www/shifd-marketing/backend
            npm ci
            npm run db:generate
            npm run build

            echo "=== Building frontend ==="
            cd /var/www/shifd-marketing/frontend
            npm ci
            npm run build

            echo "=== Applying database migrations ==="
            cd /var/www/shifd-marketing/backend
            npm run db:deploy

            echo "=== Restarting backend ==="
            pm2 restart shifd-marketing-api --update-env
            pm2 save

            echo "=== Checking backend ==="
            curl -sS -o /dev/null http://127.0.0.1:3000

            echo "=== Checking frontend ==="
            curl -fsS http://127.0.0.1 > /dev/null

            echo "=== Deployment completed ==="
            pm2 status
          EOF